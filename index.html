<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Collection Pro</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#f97316",
            secondary: "#10b981",
            danger: "#ef4444",
            warning: "#f59e0b",
            "background-light": "#f3f4f6",
            "background-dark": "#111827",
            "surface-light": "#ffffff",
            "surface-dark": "#1f2937",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
            xl: "1rem",
            '2xl': "1.25rem",
          },
        },
      },
    };
  </script>
</head>

<body
  class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans selection:bg-primary selection:text-white">

  <!-- Main Content Area -->
  <div id="app" class="min-h-screen pb-24 transition-opacity duration-200 opacity-100">
    <!-- Initial Loading State -->
    <div class="flex flex-col items-center justify-center min-h-screen pb-20">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent mb-4"></div>
      <p class="text-gray-500 font-medium animate-pulse">Loading Collection Pro...</p>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav
    class="fixed bottom-0 w-full bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-700 pb-safe pt-2 px-6 flex justify-between items-center z-40 pb-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <button onclick="window.router.navigate('GLOBAL_DASHBOARD')"
      class="nav-btn flex flex-col items-center gap-1 transition-colors text-primary" data-view="GLOBAL_DASHBOARD">
      <span class="material-icons-round text-2xl">analytics</span>
      <span class="text-[10px] font-medium">Reports</span>
    </button>
    <button onclick="window.router.navigate('STAFF_LIST')"
      class="nav-btn flex flex-col items-center gap-1 transition-colors text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      data-view="STAFF_LIST">
      <span class="material-icons-round text-2xl">people</span>
      <span class="text-[10px] font-medium">Staff</span>
    </button>
    <button onclick="window.router.navigate('RISK_CENTER')"
      class="nav-btn flex flex-col items-center gap-1 transition-colors text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      data-view="RISK_CENTER">
      <span class="material-icons-round text-2xl">notifications</span>
      <span class="text-[10px] font-medium">Alerts</span>
    </button>
    <button onclick="window.router.navigate('PROFILE')"
      class="nav-btn flex flex-col items-center gap-1 transition-colors text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      data-view="PROFILE">
      <span class="material-icons-round text-2xl">account_circle</span>
      <span class="text-[10px] font-medium">Profile</span>
    </button>
  </nav>

  <!-- Mock Data -->
  <script src="mockData.js"></script>

  <!-- App Logic -->
  <script src="script.js"></script>
</body>

</html>
